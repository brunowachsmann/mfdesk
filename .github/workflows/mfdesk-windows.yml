name: MF Desk (Windows+Android)
'on':
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      upload-tag:
        type: string
        default: nightly
env:
  SCITER_RUST_VERSION: '1.75'
  RUST_VERSION: '1.75'
  MAC_RUST_VERSION: '1.81'
  CARGO_NDK_VERSION: 3.1.2
  SCITER_ARMV7_CMAKE_VERSION: 3.29.7
  SCITER_NASM_DEBVERSION: 2.15.05-1
  LLVM_VERSION: 15.0.6
  FLUTTER_VERSION: 3.24.5
  ANDROID_FLUTTER_VERSION: 3.24.5
  FLUTTER_ELINUX_VERSION: 3.16.9
  TAG_NAME: ${{ inputs.upload-tag }}
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  VCPKG_COMMIT_ID: 120deac3062162151622ca4860575a33844ba10b
  ARMV7_VCPKG_COMMIT_ID: 6f29f12e82a8293156836ad81cc9bf5af41fe836
  VERSION: 1.4.6
  NDK_VERSION: r27c
  ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
  MACOS_P12_BASE64: ${{ secrets.MACOS_P12_BASE64 }}
  UPLOAD_ARTIFACT: ${{ inputs.upload-artifact }}
  SIGN_BASE_URL: ${{ secrets.SIGN_BASE_URL }}-2
jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: ${{ inputs.upload-artifact }}
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
    strategy:
      fail-fast: false
  build-for-windows-flutter:
    name: ${{ matrix.job.target }}
    needs:
    - build-RustDeskTempTopMostWindow
    - generate-bridge
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: x86_64-pc-windows-msvc
          os: windows-2022
          arch: x86_64
          vcpkg-triplet: x64-windows-static
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v6
      with:
        script: 'core.exportVariable(''ACTIONS_CACHE_URL'', process.env.ACTIONS_CACHE_URL || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN || '''');

          '
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Restore bridge files
      uses: actions/download-artifact@master
      with:
        name: bridge-artifact
        path: ./
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@v1
      with:
        version: ${{ env.LLVM_VERSION }}
    - name: Install flutter
      uses: subosito/flutter-action@v2.12.0
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
    - name: Replace engine with rustdesk custom flutter engine
      run: 'flutter doctor -v

        flutter precache --windows

        Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip

        Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release

        mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

        '
    - name: Patch flutter
      shell: bash
      run: 'cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))

        cd $(dirname $(dirname $(which flutter)))

        [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

        '
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ env.SCITER_RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: rustfmt
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: ${{ matrix.job.os }}
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      env:
        VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
      run: "if ! $VCPKG_ROOT/vcpkg \\\n  install \\\n  --triplet ${{ matrix.job.vcpkg-triplet }} \\\n  --x-install-root=\"$VCPKG_ROOT/installed\"; then\n  find \"${VCPKG_ROOT}/\" -name \"*.log\" | while read -r _1; do\n    echo \"$_1:\"\n    echo \"======\"\n    cat \"$_1\"\n    echo \"======\"\n    echo \"\"\n  done\n  exit 1\nfi\nhead -n 100 \"${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log\" || true\n"
      shell: bash
    - name: Build rustdesk
      run: "# Windows: build RustDesk\npython3 .\\build.py --portable --hwcodec --flutter --vram --skip-portable-pack\nmv ./flutter/build/windows/x64/runner/Release ./rustdesk\n\n# Download usbmmidd_v2.zip and extract it to ./rustdesk\nInvoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip\nExpand-Archive usbmmidd_v2.zip -DestinationPath .\nRemove-Item -Path usbmmidd_v2\\Win32 -Recurse\nRemove-Item -Path \"usbmmidd_v2\\deviceinstaller64.exe\", \"usbmmidd_v2\\deviceinstaller.exe\", \"usbmmidd_v2\\usbmmidd.bat\"\nmv -Force .\\usbmmidd_v2 ./rustdesk\n\n# Download printer driver files and extract them to ./rustdesk\ntry {\n  Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip\n  Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip\n  Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums\n\n  # Check and move the files\n  $checksum_driver = (Select-String -Path .\\sha256sums -Pattern '^([a-fA-F0-9]{64}) \\*rustdesk_printer_driver_v4-1.4\\.zip$').Matches.Groups[1].Value\n  $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256\n  $checksum_adapter = (Select-String -Path .\\sha256sums -Pattern '^([a-fA-F0-9]{64}) \\*printer_driver_adapter\\.zip$').Matches.Groups[1].Value\n  $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256\n  if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {\n      Write-Output \"rustdesk_printer_driver_v4-1.4, checksums match, extract the file.\"\n      Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .\n      mkdir ./rustdesk/drivers\n      mv -Force .\\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver\n      Expand-Archive printer_driver_adapter.zip -DestinationPath .\n      mv -Force .\\printer_driver_adapter.dll ./rustdesk\n  } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {\n      Write-Output \"rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file.\"\n  } else {\n      Write-Output \"printer_driver_adapter.dll, checksums do not match, ignore the file.\"\n  }\n} catch {\n    Write-Host \"Ingore the printer driver error.\"\n}\n"
    - name: find Runner.res
      continue-on-error: true
      shell: bash
      run: "runner_res=$(find . -name \"Runner.res\");\nif [ \"$runner_res\" == \"\" ]; then\n  echo \"Runner.res: not found\";\nelse\n  echo \"Runner.res: $runner_res\";\n  cp $runner_res ./libs/portable/Runner.res;\n  echo \"list ./libs/portable/Runner.res\";\n  ls -l ./libs/portable/Runner.res;\nfi\n"
    - name: Download RustDeskTempTopMostWindow artifacts
      uses: actions/download-artifact@master
      if: ${{ inputs.upload-artifact }}
      with:
        name: topmostwindow-artifacts
        path: ./rustdesk
    - name: Upload unsigned
      if: env.UPLOAD_ARTIFACT == 'true'
      uses: actions/upload-artifact@master
      with:
        name: rustdesk-unsigned-windows-${{ matrix.job.arch }}
        path: rustdesk
    - name: Sign rustdesk files
      if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
      shell: bash
      run: 'pip3 install requests argparse

        BASE_URL=${{ env.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY }} python3 res/job.py sign_files ./rustdesk/

        '
    - name: Build self-extracted executable
      shell: bash
      if: env.UPLOAD_ARTIFACT == 'true'
      run: 'sed -i ''/dpiAware/d'' res/manifest.xml

        pushd ./libs/portable

        pip3 install -r requirements.txt

        python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe

        popd

        mkdir -p ./SignOutput

        mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.exe

        '
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
    - name: Build msi
      if: env.UPLOAD_ARTIFACT == 'true'
      run: 'pushd ./res/msi

        Move-Item ../../rustdesk/rustdesk.exe "../../rustdesk/MF Desk.exe"; python preprocess.py --arp -d ../../rustdesk --app-name "MF Desk" -m "MFronza Informatica LTDA"

        nuget restore msi.sln

        msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10

        mv ./Package/bin/x64/Release/en-us/Package.msi ../../SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.msi

        sha256sum ../../SignOutput/rustdesk-*.msi

        '
      continue-on-error: true
    - name: Sign rustdesk self-extracted file
      if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
      shell: bash
      run: 'BASE_URL=${{ env.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY }} python3 res/job.py sign_files ./SignOutput

        '
    - name: Publish Release
      uses: softprops/action-gh-release@v1
      if: env.UPLOAD_ARTIFACT == 'true'
      with:
        prerelease: true
        tag_name: ${{ env.TAG_NAME }}
        files: './SignOutput/rustdesk-*.msi

          ./SignOutput/rustdesk-*.exe

          '
  build-rustdesk-android:
    needs:
    - generate-bridge
    name: build rustdesk android apk ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - arch: aarch64
          target: aarch64-linux-android
          os: ubuntu-24.04
          reltype: release
          suffix: ''
        - arch: armv7
          target: armv7-linux-androideabi
          os: ubuntu-24.04
          reltype: release
          suffix: ''
        - arch: x86_64
          target: x86_64-linux-android
          os: ubuntu-24.04
          reltype: release
          suffix: ''
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: false
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: false
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v6
      with:
        script: 'core.exportVariable(''ACTIONS_CACHE_URL'', process.env.ACTIONS_CACHE_URL || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN || '''');

          '
    - name: Install dependencies
      run: "sudo apt-get update\nsudo apt-get install -y \\\n     clang \\\n     cmake \\\n     curl \\\n     gcc-multilib \\\n     git \\\n     g++ \\\n     g++-multilib \\\n     libayatana-appindicator3-dev \\\n     libasound2-dev \\\n     libc6-dev \\\n     libclang-dev \\\n     libunwind-dev \\\n     libgstreamer1.0-dev \\\n     libgstreamer-plugins-base1.0-dev \\\n     libgtk-3-dev \\\n     libpam0g-dev \\\n     libpulse-dev \\\n     libva-dev \\\n     libxcb-randr0-dev \\\n     libxcb-shape0-dev \\\n     libxcb-xfixes0-dev \\\n     libxdo-dev \\\n     libxfixes-dev \\\n     llvm-dev \\\n     nasm \\\n     ninja-build \\\n     openjdk-17-jdk-headless \\\n     pkg-config \\\n     tree \\\n     wget\n"
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}
    - name: Patch flutter
      run: 'cd $(dirname $(dirname $(which flutter)))

        [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]] && git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

        '
    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: ${{ env.NDK_VERSION }}
        add-to-path: true
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: /opt/artifacts/vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      run: "case ${{ matrix.job.target }} in\n  aarch64-linux-android)\n    ANDROID_TARGET=arm64-v8a\n  ;;\n  armv7-linux-androideabi)\n    ANDROID_TARGET=armeabi-v7a\n  ;;\n  x86_64-linux-android)\n    ANDROID_TARGET=x86_64\n  ;;\n  i686-linux-android)\n    ANDROID_TARGET=x86\n  ;;\nesac\nif ! ./flutter/build_android_deps.sh \"${ANDROID_TARGET}\"; then\n  find \"${VCPKG_ROOT}/\" -name \"*.log\" | while read -r _1; do\n    echo \"$_1:\"\n    echo \"======\"\n    cat \"$_1\"\n    echo \"======\"\n    echo \"\"\n  done\n  exit 1\nfi\n"
      shell: bash
    - name: Restore bridge files
      uses: actions/download-artifact@master
      with:
        name: bridge-artifact
        path: ./
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ env.RUST_VERSION }}
        components: rustfmt
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: rustdesk-lib-cache-android
        key: ${{ matrix.job.target }}
    - name: Build rustdesk lib
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: "rustup target add ${{ matrix.job.target }}\ncargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked\ncase ${{ matrix.job.target }} in\n  aarch64-linux-android)\n    ./flutter/ndk_arm64.sh\n    mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so\n  ;;\n  armv7-linux-androideabi)\n    ./flutter/ndk_arm.sh\n    mkdir -p ./flutter/android/app/src/main/jniLibs/armeabi-v7a\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so\n  ;;\n  x86_64-linux-android)\n    ./flutter/ndk_x64.sh\n    mkdir -p ./flutter/android/app/src/main/jniLibs/x86_64\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so\n  ;;\n  i686-linux-android)\n    ./flutter/ndk_x86.sh\n    mkdir -p ./flutter/android/app/src/main/jniLibs/x86\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86/librustdesk.so\n  ;;\nesac\n"
    - name: Upload Rustdesk library to Artifacts
      uses: actions/upload-artifact@master
      with:
        name: librustdesk.so.${{ matrix.job.target }}
        path: ./target/${{ matrix.job.target }}/release/liblibrustdesk.so
    - name: Build rustdesk
      shell: bash
      env:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      run: "export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH\n# Increase Gradle JVM memory for CI builds\nsed -i \"s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g\" ./flutter/android/gradle.properties\n# temporary use debug sign config\nsed -i \"s/signingConfigs.release/signingConfigs.debug/g\" ./flutter/android/app/build.gradle\ncase ${{ matrix.job.target }} in\n  aarch64-linux-android)\n    mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a\n    cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so\n    # build flutter\n    pushd flutter\n    flutter build apk \"--${{ matrix.job.reltype }}\" --target-platform android-arm64 --split-per-abi\n    mv build/app/outputs/flutter-apk/app-arm64-v8a-${{ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk\n  ;;\n  armv7-linux-androideabi)\n    mkdir -p ./flutter/android/app/src/main/jniLibs/armeabi-v7a\n    cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so\n    # build flutter\n    pushd flutter\n    flutter build apk \"--${{ matrix.job.reltype }}\" --target-platform android-arm --split-per-abi\n    mv build/app/outputs/flutter-apk/app-armeabi-v7a-${{ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk\n  ;;\n  x86_64-linux-android)\n    mkdir -p ./flutter/android/app/src/main/jniLibs/x86_64\n    cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/x86_64/\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so\n    # build flutter\n    pushd flutter\n    flutter build apk \"--${{ matrix.job.reltype }}\" --target-platform android-x64 --split-per-abi\n    mv build/app/outputs/flutter-apk/app-x86_64-${{ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk\n  ;;\n  i686-linux-android)\n    mkdir -p ./flutter/android/app/src/main/jniLibs/x86\n    cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/i686-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/x86/\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86/librustdesk.so\n    # build flutter\n    pushd flutter\n    flutter build apk \"--${{ matrix.job.reltype }}\" --target-platform android-x86 --split-per-abi\n    mv build/app/outputs/flutter-apk/app-x86-${{ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk\n  ;;\nesac\npopd\nmkdir -p signed-apk; pushd signed-apk\nmv ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk .\n"
    - name: Setup sign tool version variable
      shell: bash
      run: 'BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)

        echo "ANDROID_SIGN_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV

        echo Last build tool version is: $BUILD_TOOL_VERSION

        '
    - uses: r0adkll/sign-android-release@v1
      name: Sign app APK
      if: env.ANDROID_SIGNING_KEY != null
      id: sign-rustdesk
      with:
        releaseDirectory: ./signed-apk
        signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
        alias: ${{ secrets.ANDROID_ALIAS }}
        keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: ${{ env.ANDROID_SIGN_TOOL_VERSION }}
    - name: Upload Artifacts
      if: env.ANDROID_SIGNING_KEY != null && env.UPLOAD_ARTIFACT == 'true'
      uses: actions/upload-artifact@master
      with:
        name: rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.apk
        path: ${{steps.sign-rustdesk.outputs.signedReleaseFile}}
    - name: Publish signed apk package
      if: env.ANDROID_SIGNING_KEY != null && env.UPLOAD_ARTIFACT == 'true'
      uses: softprops/action-gh-release@v1
      with:
        prerelease: true
        tag_name: ${{ env.TAG_NAME }}
        files: '${{steps.sign-rustdesk.outputs.signedReleaseFile}}

          '
    - name: Publish unsigned apk package
      if: env.ANDROID_SIGNING_KEY == null && env.UPLOAD_ARTIFACT == 'true'
      uses: softprops/action-gh-release@v1
      with:
        prerelease: true
        tag_name: ${{ env.TAG_NAME }}
        files: 'signed-apk/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.apk

          '
  build-rustdesk-android-universal:
    needs:
    - build-rustdesk-android
    name: build rustdesk android universal apk
    if: ${{ inputs.upload-artifact }}
    runs-on: ubuntu-24.04
    env:
      reltype: release
      x86_target: ''
      suffix: ''
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: false
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: false
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v6
      with:
        script: 'core.exportVariable(''ACTIONS_CACHE_URL'', process.env.ACTIONS_CACHE_URL || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN || '''');

          '
    - name: Install dependencies
      run: "sudo apt-get update\nsudo apt-get install -y \\\n     clang \\\n     cmake \\\n     curl \\\n     gcc-multilib \\\n     git \\\n     g++ \\\n     g++-multilib \\\n     libayatana-appindicator3-dev \\\n     libasound2-dev \\\n     libc6-dev \\\n     libclang-dev \\\n     libunwind-dev \\\n     libgstreamer1.0-dev \\\n     libgstreamer-plugins-base1.0-dev \\\n     libgtk-3-dev \\\n     libpam0g-dev \\\n     libpulse-dev \\\n     libva-dev \\\n     libxcb-randr0-dev \\\n     libxcb-shape0-dev \\\n     libxcb-xfixes0-dev \\\n     libxdo-dev \\\n     libxfixes-dev \\\n     llvm-dev \\\n     nasm \\\n     ninja-build \\\n     openjdk-17-jdk-headless \\\n     pkg-config \\\n     tree \\\n     wget\n"
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}
    - name: Patch flutter
      run: 'cd $(dirname $(dirname $(which flutter)))

        [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]] && git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

        '
    - name: Restore bridge files
      uses: actions/download-artifact@master
      with:
        name: bridge-artifact
        path: ./
    - name: Download Rustdesk library from Artifacts
      uses: actions/download-artifact@master
      with:
        name: librustdesk.so.aarch64-linux-android
        path: ./flutter/android/app/src/main/jniLibs/arm64-v8a
    - name: Download Rustdesk library from Artifacts
      uses: actions/download-artifact@master
      with:
        name: librustdesk.so.armv7-linux-androideabi
        path: ./flutter/android/app/src/main/jniLibs/armeabi-v7a
    - name: Download Rustdesk library from Artifacts
      uses: actions/download-artifact@master
      with:
        name: librustdesk.so.x86_64-linux-android
        path: ./flutter/android/app/src/main/jniLibs/x86_64
    - name: Download Rustdesk library from Artifacts
      if: ${{ env.reltype == 'debug' }}
      uses: actions/download-artifact@master
      with:
        name: librustdesk.so.i686-linux-android
        path: ./flutter/android/app/src/main/jniLibs/x86
    - name: Build rustdesk
      shell: bash
      env:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      run: "export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH\n# Increase Gradle JVM memory for CI builds\nsed -i \"s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g\" ./flutter/android/gradle.properties\n# temporary use debug sign config\nsed -i \"s/signingConfigs.release/signingConfigs.debug/g\" ./flutter/android/app/build.gradle\nmv ./flutter/android/app/src/main/jniLibs/arm64-v8a/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so\ncp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/\nmv ./flutter/android/app/src/main/jniLibs/armeabi-v7a/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so\ncp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/\nmv ./flutter/android/app/src/main/jniLibs/x86_64/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so\ncp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/x86_64/\nif [ \"${{ env.reltype }}\" = \"debug\" ]; then\n  mv ./flutter/android/app/src/main/jniLibs/x86/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86/librustdesk.so\n  cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/i686-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/x86/\nfi\n# build flutter\npushd flutter\nflutter build apk \"--${{ env.reltype }}\" --target-platform android-arm64,android-arm,android-x64${{ env.x86_target }}\npopd\nmkdir -p signed-apk\nmv ./flutter/build/app/outputs/flutter-apk/app-${{ env.reltype }}.apk signed-apk/rustdesk-${{ env.VERSION }}-universal${{ env.suffix }}.apk\n"
    - name: Setup sign tool version variable
      shell: bash
      run: 'BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)

        echo "ANDROID_SIGN_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV

        echo Last build tool version is: $BUILD_TOOL_VERSION

        '
    - uses: r0adkll/sign-android-release@v1
      name: Sign app APK
      if: env.ANDROID_SIGNING_KEY != null
      id: sign-rustdesk
      with:
        releaseDirectory: ./signed-apk
        signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
        alias: ${{ secrets.ANDROID_ALIAS }}
        keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: ${{ env.ANDROID_SIGN_TOOL_VERSION }}
    - name: Upload Artifacts
      if: env.ANDROID_SIGNING_KEY != null && env.UPLOAD_ARTIFACT == 'true'
      uses: actions/upload-artifact@master
      with:
        name: rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.apk
        path: ${{steps.sign-rustdesk.outputs.signedReleaseFile}}
    - name: Publish signed apk package
      if: env.ANDROID_SIGNING_KEY != null && env.UPLOAD_ARTIFACT == 'true'
      uses: softprops/action-gh-release@v1
      with:
        prerelease: true
        tag_name: ${{ env.TAG_NAME }}
        files: '${{steps.sign-rustdesk.outputs.signedReleaseFile}}

          '
    - name: Publish unsigned apk package
      if: env.ANDROID_SIGNING_KEY == null && env.UPLOAD_ARTIFACT == 'true'
      uses: softprops/action-gh-release@v1
      with:
        prerelease: true
        tag_name: ${{ env.TAG_NAME }}
        files: 'signed-apk/rustdesk-${{ env.VERSION }}-universal${{ env.suffix }}.apk

          '
